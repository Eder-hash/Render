<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Generador de Personas</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container center">
        <h1>Aplicacion de Eder Lucio</h1>
        <h2>Generador de Personas Ficticias</h2>
        <p>Presiona el botón para obtener los datos de una persona aleatoria.</p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form action="/generar" method="POST">
            <button type="submit" class="btn">Generar datos</button>
        </form>
        <p>Aplicacion publicada desde la UPMH 11-Ago-2026</p>
    </div>
</body>
</html>
